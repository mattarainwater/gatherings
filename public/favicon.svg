<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="puzzlePiece">
      <path d="M 10,10 L 50,10 
               C 50,5 55,0 60,0 C 65,0 70,5 70,10 
               L 90,10 L 90,50 
               C 95,50 100,55 100,60 C 100,65 95,70 90,70 
               L 90,90 L 50,90 
               C 50,95 45,100 40,100 C 35,100 30,95 30,90 
               L 10,90 L 10,50 
               C 5,50 0,45 0,40 C 0,35 5,30 10,30 
               Z"/>
    </clipPath>
  </defs>
  
  <!-- Background with five MTG colors in a circular pattern -->
  <g clip-path="url(#puzzlePiece)">
    <!-- White (top) -->
    <path d="M 50,0 L 100,0 L 100,50 Z" fill="#F0E8D8"/>
    
    <!-- Blue (top-right) -->
    <path d="M 100,50 L 100,100 L 50,100 Z" fill="#0E68AB"/>
    
    <!-- Black (bottom) -->
    <path d="M 50,100 L 0,100 L 0,50 Z" fill="#150B00"/>
    
    <!-- Red (bottom-left) -->
    <path d="M 0,50 L 0,0 L 50,0 Z" fill="#D3202A"/>
    
    <!-- Green (center) -->
    <circle cx="50" cy="50" r="25" fill="#00733E"/>
  </g>
  
  <!-- Puzzle piece outline -->
  <path d="M 10,10 L 50,10 
           C 50,5 55,0 60,0 C 65,0 70,5 70,10 
           L 90,10 L 90,50 
           C 95,50 100,55 100,60 C 100,65 95,70 90,70 
           L 90,90 L 50,90 
           C 50,95 45,100 40,100 C 35,100 30,95 30,90 
           L 10,90 L 10,50 
           C 5,50 0,45 0,40 C 0,35 5,30 10,30 
           Z" 
        fill="none" stroke="#333" stroke-width="2"/>
</svg>
